name: Apply reviewed PR62 release safeguards
on:
  push:
    branches: [feat/building-d1-publication]
    paths: [.github/workflows/repair-pr62-safety.yml, .review/pr62-safety.xz]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply source edits with preimage and result verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma
          raw=lzma.decompress(Path('.review/pr62-safety.xz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='2dccc2b61bc3205e73e84b7c3bcc2b65270819d7e68af5f38b5720f8f41495e2'
          for c in json.loads(raw):
              p=Path(c['path'])
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ('scripts','server','test','tools')
              s=p.read_text() if p.exists() else ''
              assert hashlib.sha256(s.encode()).hexdigest()==c['old'],c['path']
              for a,b,v in reversed(c['edits']): s=s[:a]+v+s[b:]
              assert hashlib.sha256(s.encode()).hexdigest()==c['new'],c['path']
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(s)
          PY
          node --test scripts/building-release.test.mjs
          git diff --check
          git config user.name building-platform
          git config user.email building-platform@users.noreply.github.com
          git add scripts server test tools
          git -c core.hooksPath=/dev/null commit -m 'fix: gate incomplete migrations and require expiring clean release credentials'
          git push origin HEAD:feat/building-d1-publication
