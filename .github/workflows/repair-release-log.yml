name: Release log safety cleanup
on:
  push:
    branches: [fix/building-release-log-safety]
    paths: [.github/workflows/repair-release-log.yml]
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Delete only the identified raw release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url='https://api.github.com/repos/caaaptaintop/newsnow/actions/artifacts/10127559734'
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          const deleted=await fetch(url,{method:'DELETE',headers,signal:AbortSignal.timeout(30000)})
          if(![204,404].includes(deleted.status))throw new Error(`Artifact cleanup failed: HTTP ${deleted.status}`)
          const check=await fetch(url,{headers,signal:AbortSignal.timeout(30000)})
          if(check.status!==404)throw new Error(`Artifact deletion unconfirmed: HTTP ${check.status}`)
          console.log(JSON.stringify({artifactId:10127559734,removed:true,otherArtifactsUnchanged:true}))
          JS
      - name: Apply reviewed source-only changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/building-release.mjs');s=p.read_text()
          old='  if (env.GITHUB_ACTIONS) { log(`::add-mask::${deployToken}`); log(`::add-mask::${rateSalt}`) }\n'
          assert s.count(old)==1 and s.count('building-relay-v3:${account}')==1
          s=s.replace(old,'  // Redact before logging: runner masking commands themselves must never enter tee artifacts.\n').replace('building-relay-v3:${account}','building-relay-v3.1:${account}')
          p.write_text(s)
          p=Path('scripts/building-release.test.mjs');s=p.read_text()
          assert 'never emits raw masking commands' not in s
          s+='\nit("never emits raw masking commands into tee-captured artifact logs", async () => {\n  const f = fixture()\n  f.options.env.GITHUB_ACTIONS = "true"\n  await releaseBuilding(f.options)\n  assert(!f.logs.some(line => line.startsWith("::add-mask::")))\n  assert(!/[a-f0-9]{64}/.test(f.logs.join("\\n")), "transient secrets must not enter file logs")\n})\n'
          p.write_text(s)
          PY
          node --test scripts/building-release.test.mjs
          git diff --check
          git config user.name building-platform
          git config user.email building-platform@users.noreply.github.com
          git add scripts/building-release.mjs scripts/building-release.test.mjs
          git -c core.hooksPath=/dev/null commit -m 'fix: sanitize release logs before artifact capture and rotate relay salt'
          git push origin HEAD:fix/building-release-log-safety
