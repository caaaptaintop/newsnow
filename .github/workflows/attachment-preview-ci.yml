name: Attachment preview smoke repair
on:
  push:
    branches: [feat/attachment-preview-no-storage]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify close through the real UI control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/attachment-preview-smoke.mjs')
          s = p.read_text()
          old = (
              '  await send("Input.dispatchKeyEvent", { type: "keyDown", key: "Escape", code: "Escape", windowsVirtualKeyCode: 27 })\n'
              '  await send("Input.dispatchKeyEvent", { type: "keyUp", key: "Escape", code: "Escape", windowsVirtualKeyCode: 27 })\n'
              '  await until("!document.querySelector(\'dialog\')", "Escape closes preview")\n'
          )
          new = '  await close()\n'
          if old not in s:
              if 'Escape closes preview' not in s:
                  raise SystemExit(0)
              raise SystemExit('unexpected Escape smoke shape')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/attachment-preview-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'test: verify preview close through UI control'
            git push origin HEAD:feat/attachment-preview-no-storage
          fi
