name: Attachment preview smoke repair
on:
  push:
    branches: [feat/attachment-preview-no-storage]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use trusted keyboard input in Chrome smoke test
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('scripts/attachment-preview-smoke.mjs')
          s = p.read_text()
          old = "  await evaluate(\"(()=>{const input=document.querySelector('dialog input');const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;setter.call(input,'项目名称');input.dispatchEvent(new InputEvent('input',{bubbles:true,composed:true,inputType:'insertText',data:'项目名称'}))})()\")\n  await until(\"document.querySelector('iframe').srcdoc.includes('<mark>项目名称</mark>')\", \"document search\")\n"
          new = "  await evaluate(\"document.querySelector('dialog input').focus()\")\n  await send(\"Input.dispatchKeyEvent\", { type: \"char\", text: \"项目名称\" })\n  await until(\"document.querySelector('dialog input').value === '项目名称'\", \"document search input\")\n  await until(\"document.querySelector('iframe').srcdoc.includes('<mark>项目名称</mark>')\", \"document search\")\n"
          if old in s:
              p.write_text(s.replace(old, new))
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add',str(p)], check=True)
              subprocess.run(['git','commit','-m','test: use trusted Chrome character input'], check=True)
              subprocess.run(['git','push','origin','HEAD:feat/attachment-preview-no-storage'], check=True)
          elif 'document search input' not in s:
              raise SystemExit('expected smoke input block not found')
