name: Attachment preview smoke repair
on:
  push:
    branches: [feat/attachment-preview-no-storage]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired document-search smoke lines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/attachment-preview-smoke.mjs')
          s = p.read_text()
          needles = [
              "  await evaluate(\"document.querySelector('dialog input').focus()\")\n",
              "  for (const char of \"项目名称\") await send(\"Input.dispatchKeyEvent\", { type: \"char\", text: char })\n",
              "  await until(\"document.querySelector('dialog input').value === '项目名称'\", \"document search input\")\n",
              "  await until(\"document.querySelector('iframe').srcdoc.includes('<mark>项目名称</mark>')\", \"document search\")\n",
          ]
          missing = [line for line in needles if line not in s]
          if missing:
              if 'document search input' not in s and '<mark>项目名称</mark>' not in s:
                  raise SystemExit(0)
              raise SystemExit(f'unexpected search smoke shape: {missing!r}')
          for line in needles:
              s = s.replace(line, '')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/attachment-preview-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'test: drop retired document search smoke'
            git push origin HEAD:feat/attachment-preview-no-storage
          fi
