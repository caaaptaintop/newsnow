name: Attachment preview smoke repair
on:
  push:
    branches: [feat/attachment-preview-no-storage]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send Unicode search text one Chrome character at a time
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('scripts/attachment-preview-smoke.mjs')
          s = p.read_text()
          old = "  await send(\"Input.dispatchKeyEvent\", { type: \"char\", text: \"项目名称\" })\n"
          new = "  for (const char of \"项目名称\") await send(\"Input.dispatchKeyEvent\", { type: \"char\", text: char })\n"
          if old in s:
              p.write_text(s.replace(old, new))
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add',str(p)], check=True)
              subprocess.run(['git','commit','-m','test: send Unicode search text character by character'], check=True)
              subprocess.run(['git','push','origin','HEAD:feat/attachment-preview-no-storage'], check=True)
          elif 'for (const char of "项目名称")' not in s:
              raise SystemExit('expected Chrome char input line not found')
