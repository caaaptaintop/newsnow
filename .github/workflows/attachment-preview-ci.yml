name: Attachment preview validation
on:
  push:
    branches: [feat/attachment-preview-no-storage]
  pull_request:
    branches: [main]
    paths:
      - 'src/components/attachment-preview/**'
      - 'src/components/intelligence/index.tsx'
      - 'server/api/intelligence/attachment*'
      - 'server/utils/attachment*'
      - 'server/middleware/ai-settings.ts'
      - 'shared/attachment*'
      - 'test/attachment*'
      - 'scripts/attachment-preview*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/attachment-preview-ci.yml'
permissions:
  contents: read
concurrency:
  group: attachment-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Attachment, authorization and existing workspace regressions
        run: pnpm exec vitest run test/attachment-preview.test.ts test/attachment-route.test.ts test/intelligence-attachments.test.ts test/intelligence.test.ts test/mac-batch.test.ts
      - name: Metadata-only storage regressions
        run: node --experimental-strip-types --test test/intelligence-storage.test.mjs
      - name: Cloudflare production build
        run: pnpm run build
        env:
          CF_PAGES: 1
      - name: Reject changed-file type errors
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit -p tsconfig.node.json > typecheck-node.txt 2>&1
          pnpm exec tsc --noEmit -p tsconfig.app.json > typecheck-app.txt 2>&1
          set -e
          python - <<'PY'
          import re, subprocess, sys
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines())
          bad, inherited = [], []
          for path in ('typecheck-node.txt', 'typecheck-app.txt'):
              for line in open(path):
                  match = re.match(r'^([^\s(]+)\(\d+,\d+\): error TS', line)
                  if match:
                      (bad if match.group(1) in changed else inherited).append(line.rstrip())
                  elif 'error TS' in line:
                      bad.append(line.rstrip())
          print(f'Changed-file diagnostics: {len(bad)}; inherited diagnostics: {len(inherited)}')
          print('\n'.join(bad))
          sys.exit(bool(bad))
          PY
      - name: Real Chrome document preview checks
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir="$(mktemp -d)" about:blank >/tmp/attachment-chrome.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/attachment-preview-smoke.mjs
      - name: Preserve validation evidence (synthetic fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-preview-evidence
          path: |
            typecheck-node.txt
            typecheck-app.txt
            attachment-test-results/
          if-no-files-found: ignore
          retention-days: 7
