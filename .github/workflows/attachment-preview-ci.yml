name: Attachment preview finalize
on:
  push:
    branches: [feat/attachment-preview-no-storage]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified remaining patch once
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/attachment-preview-remaining.patch.gz.b64 | gunzip > /tmp/attachment-preview-remaining.patch
          git apply --check --exclude=.github/workflows/attachment-preview-ci.yml /tmp/attachment-preview-remaining.patch
          git apply --exclude=.github/workflows/attachment-preview-ci.yml /tmp/attachment-preview-remaining.patch
          printf '%s' '' | base64 -d > .github/workflows/attachment-preview-ci.yml
          rm tools/attachment-preview-remaining.patch.gz.b64
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire attachment preview and validation'
          git push origin HEAD:feat/attachment-preview-no-storage
