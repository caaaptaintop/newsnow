name: Apply CMS attachment parser fix
on:
  push:
    branches: [fix/attachment-discovery-cms]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/apply-cms-attachment-fix.py
      - name: Validate parser and regressions
        run: pnpm exec vitest run test/intelligence.test.ts test/intelligence-attachments.test.ts test/attachment-preview.test.ts test/attachment-route.test.ts
      - name: Verify affected live government pages
        run: pnpm exec vite-node scripts/check-live-cms-attachments.ts
      - name: Validate changed TypeScript files
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit -p tsconfig.node.json > /tmp/type-node.txt 2>&1
          pnpm exec tsc --noEmit -p tsconfig.app.json > /tmp/type-app.txt 2>&1
          set -e
          python - <<'PY'
          import re,sys
          changed={'server/utils/intelligence-parser.ts','test/intelligence.test.ts','tools/ai-bridge/backfill-attachments.ts'}
          bad=[]
          for path in ['/tmp/type-node.txt','/tmp/type-app.txt']:
              for line in open(path):
                  m=re.match(r'^([^\s(]+)\(\d+,\d+\): error TS',line)
                  if m and m.group(1) in changed: bad.append(line.rstrip())
          print('\n'.join(bad)); sys.exit(bool(bad))
          PY
      - name: Commit functional changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/utils/intelligence-parser.ts test/intelligence.test.ts tools/ai-bridge/backfill-attachments.ts
          if ! git diff --cached --quiet; then
            git commit --no-verify -m 'fix: discover attachments emitted by government CMS scripts'
            git push origin HEAD:fix/attachment-discovery-cms
          fi
