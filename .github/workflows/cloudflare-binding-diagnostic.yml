name: Inspect Cloudflare Pages bindings
on:
  push:
    branches: [main]
    paths: [.github/workflows/cloudflare-binding-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download Pages config
        run: pnpm dlx wrangler@4.129.0 pages download config capx-newsnow --force
      - name: Print safe persistent-binding summary
        run: |
          python - <<'PY'
          import tomllib
          with open('wrangler.toml','rb') as handle:
              data = tomllib.load(handle)
          def rows(root, key):
              value = root.get(key) or []
              return value if isinstance(value, list) else [value]
          roots = [('root', data), ('production', ((data.get('env') or {}).get('production') or {}))]
          keys = ('d1_databases','kv_namespaces','r2_buckets','services','durable_objects','hyperdrive')
          total = 0
          for scope, root in roots:
              print(f'[{scope}]')
              for key in keys:
                  items = rows(root, key)
                  if not items:
                      continue
                  total += len(items)
                  safe = []
                  for item in items:
                      if isinstance(item, dict):
                          safe.append({k:item.get(k) for k in ('binding','database_name','bucket_name','service','class_name','namespace') if item.get(k)})
                  print(f'{key}: {safe}')
          print(f'TOTAL_PERSISTENT_OR_SERVICE_BINDINGS={total}')
          PY
