name: Jianing model A/B benchmark

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/jianing-model-ab.yml
      - .github/scripts/jianing_model_ab.py
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  compare-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run same-batch model comparison
        run: python .github/scripts/jianing_model_ab.py

      - name: Upload full A/B result
        uses: actions/upload-artifact@v4
        with:
          name: jianing-model-ab-results
          path: jianing-model-ab-results.json
          retention-days: 3
