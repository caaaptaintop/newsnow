name: Apply reviewed PR62 type repairs
on:
  push:
    branches: [feat/building-d1-publication]
    paths: [.github/workflows/repair-pr62.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply hash-verified type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          changes=json.loads(r'''[{"path":"scripts/prepare-public-snapshot.ts","old":"6517561be75ef325e6f7d3543f7c94cdd9ce51f85c4924c0792672ef716eef9c","new":"4ed6bf7f6916eec4c8a4183fc38c0d03d3575f28f54d032e8678356d6066e8f6","edits":[[8,18,""],[89,154,""],[288,387,""]]},{"path":"server/building/auth.ts","old":"6530ebf3e5870e473a09a529aa6705987774de6ca26bff034295c9db3fd7d3c0","new":"8f457920020e85ffef52296dc9537598917d78e04728af0662d2a39f4f65921e","edits":[[904,905,"{kty:"],[906,906,"tring,crv:string,x:string,ext?:b"],[907,907,"olea"],[908,914,"}"]]},{"path":"server/building/cache.ts","old":"76a6a088b3b02a843b8b5ed0253ecc081a5eb80ae61563d1c99a9d10ee6ac1b1","new":"1a234d04a4e6db5cf31363085d0cbb65e12f42ca5c429f748760fc59a1ab2556","edits":[[212,212,"\ninterface EdgeCache {\n  match(request: Request): Promise<Response | undefined>\n  put(request: Request, response: Response): Promise<void>\n}"],[711,711," as typeof globalThis & { caches?: { default: EdgeCache } })"],[718,726,""],[735,754,""]]},{"path":"server/building/store.ts","old":"45088eb7e4dd6ff7cf8964f22b3b71bdd75d99366d410c9bfee7c18375a8b861","new":"53f2df964a4aacf05d2b97271090e5aa81b9dfab727894c10df4634f041334b3","edits":[[0,0,"import type { IntelligenceArticle } from \"../../shared/intelligence\"\n"],[10231,10231,":Promise<IntelligenceArticle|undefined>"]]},{"path":"test/attachment-route.test.ts","old":"e79efd33b342f12b71c42949e28941716265c07105f4c52e79b83f4dfc4881c0","new":"7c3802bb3d4f110f86e6f120fc9b75f8998b66dffb66f7ec4e1a1c5b2dc8d7c7","edits":[[135,147,""]]},{"path":"test/building-platform.test.ts","old":"df13f5b86d4050f1ed864083dda998a4ab3205d268ddbc0bdb7b6f1dbbb36db4","new":"fedcb0ff2149ed8a5a9f45449ae08f66ddf6cab90bfdcceda52076a7686ef8c6","edits":[[8541,8541,"Object.entries("],[8546,8546,").filter((entry): entry is [string,string] => typeof entry[1] === \"string\")"]]},{"path":"tools/ai-bridge/apply-batch.ts","old":"c2a14c2536f781e9e22333de3009ca62532f7ec1835117b2cfd64eb76fd297f3","new":"31b795ca093f27ec1d1233e2d14a4b0e9a171d6c82a5fe008b8e6ec01c33facb","edits":[[2255,2255,"if(!version||typeof version!==\"object\"||!(\"revision\" in version)||!Number.isSafeInteger(version.revision))throw new Error(\"发布版本响应无效\");"]]}]''')
          for c in changes:
              p=Path(c['path']);s=p.read_text()
              assert hashlib.sha256(s.encode()).hexdigest()==c['old'],c['path']
              for a,b,v in reversed(c['edits']): s=s[:a]+v+s[b:]
              assert hashlib.sha256(s.encode()).hexdigest()==c['new'],c['path']
              p.write_text(s)
          PY
          git diff --check
          git config user.name building-platform
          git config user.email building-platform@users.noreply.github.com
          git add scripts server test tools
          git -c core.hooksPath=/dev/null commit -m 'fix: resolve PR62 type diagnostics with explicit boundaries'
          git push origin HEAD:feat/building-d1-publication
