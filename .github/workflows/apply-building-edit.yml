name: Apply reviewed building migration patch
on:
  push:
    branches: [feat/building-public-site]
    paths: [.github/workflows/apply-building-edit.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'caaaptaintop/newsnow' && github.ref == 'refs/heads/feat/building-public-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and apply exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 69b79c9c486348580a4f2072b60148626c7c8df4 HEAD
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          text = ''.join(Path(f'.migration/building-m1.{i}.b64').read_text().strip() for i in range(4))
          # Repair a verified transport transcription; the complete decoded patch
          # must still match the independently recorded local SHA256 exactly.
          text = text.replace('+Ilpje+f7X3Sv9rvBC', '+Ilpje+f7Xz9rvBC')
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert len(patch) == 88373
          assert hashlib.sha256(patch).hexdigest() == '58fe1ecd3ed55d8e877839a528094f2b04a2b6c21500dd83e5b6c51c5086ad05'
          Path('/tmp/building-m1.patch').write_bytes(patch)
          PY
          # Workflow updates are applied separately by the repository connector.
          git apply --check --exclude='.github/workflows/*' /tmp/building-m1.patch
          git apply --exclude='.github/workflows/*' /tmp/building-m1.patch
          git rm .migration/building-m1.*.b64
          git add -A
          git diff --cached --check
          git -c user.name='building-migration' -c user.email='building-migration@users.noreply.github.com' commit -m 'feat: introduce building-only anonymous public reader and close legacy APIs'
          git push origin HEAD:feat/building-public-site
          git rev-parse HEAD
