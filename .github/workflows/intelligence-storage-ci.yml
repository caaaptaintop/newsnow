name: Intelligence metadata storage checks
on:
  push:
    branches: [main, feat/metadata-storage-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SQLite schema, migration, and no-content-storage regression tests
        run: node --experimental-strip-types --test test/intelligence-storage.test.mjs
