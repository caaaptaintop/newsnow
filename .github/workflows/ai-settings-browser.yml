name: AI settings browser smoke
on:
  workflow_run:
    workflows: [Build and deploy Cloudflare Pages]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open settings in desktop and mobile Chrome without invoking AI
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir="$(mktemp -d)" about:blank >/tmp/ai-settings-chrome.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))
          const origin = 'https://news.capx-ai.com'
          const stateResponse = await fetch(`${origin}/api/intelligence/ai/status`)
          if (!stateResponse.ok) throw new Error(`AI status HTTP ${stateResponse.status}`)
          console.log('AI_CONFIGURATION_STATUS:', JSON.stringify(await stateResponse.json()))
          const target = await (await fetch('http://127.0.0.1:9222/json/new?about:blank', { method: 'PUT' })).json()
          const ws = new WebSocket(target.webSocketDebuggerUrl)
          const pending = new Map()
          let sequence = 0
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true })
            ws.addEventListener('error', reject, { once: true })
          })
          ws.addEventListener('message', event => {
            const message = JSON.parse(String(event.data))
            const request = pending.get(message.id)
            if (!request) return
            pending.delete(message.id); clearTimeout(request.timer)
            if (message.error) request.reject(new Error(JSON.stringify(message.error)))
            else request.resolve(message.result)
          })
          function send(method, params = {}) {
            const id = ++sequence
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => { pending.delete(id); reject(new Error(`CDP timeout: ${method}`)) }, 15000)
              pending.set(id, { resolve, reject, timer })
              ws.send(JSON.stringify({ id, method, params }))
            })
          }
          async function evaluate(expression) {
            const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true })
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.text)
            return result.result?.value
          }
          try {
            await send('Runtime.enable'); await send('Page.enable'); await send('Network.enable')
            await send('Network.setBlockedURLs', { urls: ['*/api/intelligence/refresh*', '*/api/topics/health/classify*', '*/api/intelligence/ai/test*'] })
            await send('Page.navigate', { url: `${origin}/?ai_settings_smoke=${Date.now()}` })
            let ready = false
            for (let i = 0; i < 30; i++) {
              ready = await evaluate(`Boolean(document.querySelector('.ai-settings-launch'))`)
              if (ready) break
              await sleep(500)
            }
            if (!ready) throw new Error('AI settings entry did not mount')
            for (const viewport of [{ width: 1280, height: 900, mobile: false }, { width: 390, height: 844, mobile: true }]) {
              await send('Emulation.setDeviceMetricsOverride', { ...viewport, deviceScaleFactor: 1 })
              await evaluate(`document.querySelector('.ai-settings-launch').click()`)
              await sleep(500)
              const dialog = await evaluate(`(() => { const d = document.querySelector('.ai-settings-dialog'); return { open: d?.open, width: d?.getBoundingClientRect().width, viewport: innerWidth, title: d?.querySelector('h2')?.textContent, password: Boolean(d?.querySelector('input[type=password]')) } })()`)
              if (!dialog.open || !dialog.password || dialog.title !== 'AI 接入与切换' || dialog.width > dialog.viewport + 1) throw new Error(`Invalid dialog: ${JSON.stringify(dialog)}`)
              console.log('AI_DIALOG_OK:', JSON.stringify({ ...viewport, dialog }))
              const screenshot = await send('Page.captureScreenshot', { format: 'png' })
              await writeFile(`/tmp/ai-settings-${viewport.mobile ? 'mobile' : 'desktop'}.png`, Buffer.from(screenshot.data, 'base64'))
              await evaluate(`document.querySelector('.ai-settings-heading button').click()`)
              await sleep(100)
              if (await evaluate(`document.querySelector('.ai-settings-dialog').open`)) throw new Error('Dialog did not close')
            }
            console.log('AI settings browser smoke passed; inference requests were blocked')
          } finally { ws.close() }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-settings-browser
          path: /tmp/ai-settings-*.png
          if-no-files-found: ignore
          retention-days: 7
