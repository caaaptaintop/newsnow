name: Intelligence workspace checks
on:
  push:
    branches: [feat/intelligence-workspace]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regression tests
        run: pnpm exec vitest run test/intelligence.test.ts
      - name: Cloudflare production build
        run: pnpm run build
        env:
          CF_PAGES: 1
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee typecheck-output.txt
      - name: Preserve typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-typecheck
          path: typecheck-output.txt
          if-no-files-found: ignore
