name: Refresh intelligence sources

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Build and deploy Cloudflare Pages]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: intelligence-source-sync
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh bounded batches and build durable snapshot
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import time
          import urllib.request
          from pathlib import Path

          base = 'https://news.capx-ai.com/api/intelligence'
          now = int(time.time() * 1000)
          seven_days = 7 * 86400000
          data_path = Path('data/intelligence-snapshot.json')
          snapshot = json.loads(data_path.read_text(encoding='utf-8')) if data_path.exists() else {
              'generatedAt': 0, 'articles': [], 'states': [], 'seen': {}
          }
          snapshot.setdefault('articles', [])
          snapshot.setdefault('states', [])
          snapshot.setdefault('seen', {})

          def call(url, body=None):
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'CapxIntelligenceScheduledSync/2.0',
                  },
              )
              with urllib.request.urlopen(req, timeout=210) as response:
                  return json.load(response)

          sources = []
          for topic in ('building', 'ai', 'finance'):
              feed = call(base + '?topic=' + topic)
              if not feed.get('aiEnabled'):
                  raise RuntimeError('Workers AI binding unavailable')
              sources.extend(feed.get('sources', []))

          state_by_id = {item.get('id'): item for item in snapshot['states'] if item.get('id')}
          article_by_key = {item.get('key'): item for item in snapshot['articles'] if item.get('key')}
          seen_by_source = snapshot['seen']

          def refresh(source):
              source_id = source['id']
              retained_seen = [
                  item for item in seen_by_source.get(source_id, [])
                  if isinstance(item, dict)
                  and isinstance(item.get('key'), str)
                  and isinstance(item.get('at'), (int, float))
                  and now - int(item['at']) < seven_days
              ]
              known_keys = [item['key'] for item in retained_seen[:300]]
              try:
                  result = call(base + '/refresh', {
                      'sourceId': source_id,
                      'includeArticles': True,
                      'knownKeys': known_keys,
                  })
                  state = result.get('state') or {'id': source_id, 'status': 'error', 'error': 'missing state'}
                  articles = result.get('articles') or []
                  seen_keys = result.get('seenKeys') or []
              except Exception as error:
                  state = {'id': source_id, 'status': 'error', 'checkedAt': now, 'error': str(error)[:500]}
                  articles = []
                  seen_keys = []
              print(json.dumps({'state': state, 'articles': len(articles), 'seen': len(seen_keys)}, ensure_ascii=False), flush=True)
              return source_id, state, articles, retained_seen, seen_keys

          ordered = sorted(sources, key=lambda source: -source.get('priority', 0))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results = list(pool.map(refresh, ordered))

          good = 0
          status_rows = []
          for source_id, state, articles, retained_seen, seen_keys in results:
              state_by_id[source_id] = state
              status_rows.append(state)
              if state.get('status') in ('ok', 'partial') and state.get('fetched', 0) > 0:
                  good += 1
              for article in articles:
                  key = article.get('key')
                  if key:
                      article_by_key[key] = article
              merged_seen = {item['key']: item for item in retained_seen}
              checked_at = int(state.get('checkedAt') or now)
              for key in seen_keys:
                  if isinstance(key, str):
                      merged_seen[key] = {'key': key, 'at': checked_at}
              seen_by_source[source_id] = sorted(
                  merged_seen.values(), key=lambda item: int(item.get('at', 0)), reverse=True
              )[:300]

          if not good:
              Path('intelligence-source-status.json').write_text(
                  json.dumps({'checkedAt': now, 'sources': status_rows}, ensure_ascii=False, indent=2),
                  encoding='utf-8',
              )
              raise RuntimeError('No source yielded parseable articles')

          limits = {'building': 2500, 'ai': 1200, 'finance': 1200}
          pruned_articles = []
          for topic, limit in limits.items():
              rows = [item for item in article_by_key.values() if item.get('topic') == topic]
              rows.sort(key=lambda item: (int(item.get('publishedAt') or 0), int(item.get('collectedAt') or 0)), reverse=True)
              pruned_articles.extend(rows[:limit])

          source_ids = {source['id'] for source in sources}
          pruned_states = [state_by_id[source_id] for source_id in sorted(source_ids) if source_id in state_by_id]
          pruned_seen = {source_id: seen_by_source.get(source_id, []) for source_id in sorted(source_ids)}
          final = {
              'generatedAt': now,
              'articles': pruned_articles,
              'states': pruned_states,
              'seen': pruned_seen,
          }
          data_path.parent.mkdir(parents=True, exist_ok=True)
          data_path.write_text(json.dumps(final, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          ts_payload = json.dumps(final, ensure_ascii=False, separators=(',', ':'))
          Path('shared/intelligence-snapshot.ts').write_text(
              'import type { IntelligenceArticle, IntelligenceSourceState } from "./intelligence"\n\n'
              'export interface IntelligenceSnapshotSeen { key: string; at: number }\n'
              'export interface IntelligenceSnapshot { generatedAt: number; articles: IntelligenceArticle[]; states: IntelligenceSourceState[]; seen: Record<string, IntelligenceSnapshotSeen[]> }\n\n'
              '/** Generated by .github/workflows/intelligence-sync.yml. Do not edit manually. */\n'
              f'export const intelligenceSnapshot: IntelligenceSnapshot = {ts_payload}\n',
              encoding='utf-8',
          )
          Path('intelligence-source-status.json').write_text(
              json.dumps({'checkedAt': now, 'sources': status_rows}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(f'Collected from {good}/{len(results)} configured sources; durable articles: {len(pruned_articles)}')
          PY

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/intelligence-snapshot.json shared/intelligence-snapshot.ts; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intelligence-snapshot.json shared/intelligence-snapshot.ts
          git commit -m "chore(data): refresh intelligence snapshot"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-source-status
          path: intelligence-source-status.json
          if-no-files-found: ignore
          retention-days: 7
