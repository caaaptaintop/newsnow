name: Build and deploy Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: building-production-release
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.129.0
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build without production snapshots
        run: pnpm run build
        env:
          CF_PAGES: 1
      - name: Preserve current Pages configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          pnpm dlx wrangler@${WRANGLER_VERSION} pages download config capx-newsnow --force
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('wrangler.toml')
          text = p.read_text()
          line = 'pages_build_output_dir = "dist/output/public"'
          if re.search(r'^pages_build_output_dir\s*=', text, re.M):
              text = re.sub(r'^pages_build_output_dir\s*=.*$', line, text, flags=re.M)
          else:
              text = line + '\n' + text
          p.write_text(text)
          PY
      - name: Migrate and verify trusted preview before production activation
        shell: bash
        run: |
          set -o pipefail
          node scripts/building-release.mjs 2>&1 | tee wrangler-deploy.log
      - name: Preserve sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-release-evidence
          path: |
            wrangler-deploy.log
            /tmp/building-release-evidence.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify public building endpoints
        run: node scripts/building-production-smoke.mjs
