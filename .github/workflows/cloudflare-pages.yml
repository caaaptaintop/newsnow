name: Build and deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.129.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm run build
        env:
          CF_PAGES: 1

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID. Add it either as a repository Secret or repository Variable with exactly that name."
            exit 1
          fi

      - name: Download current Pages configuration
        run: |
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          pnpm dlx wrangler@${WRANGLER_VERSION} pages download config capx-newsnow --force
          test -f wrangler.toml || (echo "::error::Expected wrangler.toml from Pages config download" && exit 1)

      - name: Resolve persistent D1 database
        shell: bash
        run: |
          set -euo pipefail
          DB_NAME=""
          DB_ID=""

          readarray -t EXISTING_D1 < <(python - <<'PY'
          import tomllib
          with open("wrangler.toml", "rb") as handle:
              data = tomllib.load(handle)
          rows = []
          rows.extend(data.get("d1_databases") or [])
          rows.extend((((data.get("env") or {}).get("production") or {}).get("d1_databases") or []))
          seen = set()
          unique = []
          for row in rows:
              key = (row.get("database_id"), row.get("database_name"))
              if not key[0] or key in seen:
                  continue
              seen.add(key)
              unique.append(row)
          unique.sort(key=lambda row: (
              0 if row.get("binding") == "NEWSNOW_DB" else
              1 if any(token in str(row.get("binding", "")).upper() for token in ("DB", "NEWS")) else 2
          ))
          if unique:
              row = unique[0]
              print(str(row.get("database_name") or "capx-newsnow-existing"))
              print(str(row.get("database_id") or ""))
          PY
          )

          if [ "${#EXISTING_D1[@]}" -ge 2 ] && [ -n "${EXISTING_D1[1]}" ]; then
            DB_NAME="${EXISTING_D1[0]}"
            DB_ID="${EXISTING_D1[1]}"
            echo "Reusing an existing D1 database already bound to capx-newsnow."
          else
            DB_NAME="capx-newsnow-intelligence"
            list_file=$(mktemp)
            if ! pnpm dlx wrangler@${WRANGLER_VERSION} d1 list --json > "$list_file"; then
              echo "::error::No D1 database is currently bound to the Pages project, and the configured Cloudflare API token cannot list/create D1 databases. Grant the token Account > D1 > Edit (or equivalent D1 read/write) permission, then rerun this workflow."
              exit 1
            fi
            DB_ID=$(python - "$list_file" "$DB_NAME" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8-sig") as handle:
              rows = json.load(handle)
          row = next((item for item in rows if item.get("name") == sys.argv[2]), None)
          print((row or {}).get("uuid") or (row or {}).get("database_id") or "")
          PY
            )
            if [ -z "$DB_ID" ]; then
              echo "Creating dedicated D1 database: $DB_NAME"
              pnpm dlx wrangler@${WRANGLER_VERSION} d1 create "$DB_NAME" --location apac
              pnpm dlx wrangler@${WRANGLER_VERSION} d1 list --json > "$list_file"
              DB_ID=$(python - "$list_file" "$DB_NAME" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8-sig") as handle:
              rows = json.load(handle)
          row = next((item for item in rows if item.get("name") == sys.argv[2]), None)
          print((row or {}).get("uuid") or (row or {}).get("database_id") or "")
          PY
              )
            fi
          fi

          if [ -z "$DB_ID" ]; then
            echo "::error::Unable to resolve a D1 database ID"
            exit 1
          fi
          echo "INTELLIGENCE_D1_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "INTELLIGENCE_D1_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "Persistent D1 database resolved."

      - name: Prepare Pages configuration, Workers AI and D1 bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          path = Path("wrangler.toml")
          text = path.read_text()
          output_line = 'pages_build_output_dir = "dist/output/public"'
          db_name = os.environ["INTELLIGENCE_D1_NAME"]
          db_id = os.environ["INTELLIGENCE_D1_ID"]

          if re.search(r'^pages_build_output_dir\s*=', text, flags=re.M):
              text = re.sub(r'^pages_build_output_dir\s*=.*$', output_line, text, flags=re.M)
          else:
              first_table = re.search(r'^\[', text, flags=re.M)
              if first_table:
                  pos = first_table.start()
                  text = text[:pos].rstrip() + f'\n{output_line}\n\n' + text[pos:]
              else:
                  text = text.rstrip() + f'\n{output_line}\n'

          if not re.search(r'^\[ai\]\s*$', text, flags=re.M):
              text = text.rstrip() + '\n\n[ai]\nbinding = "AI"\n'
          if not re.search(r'^\[env\.production\.ai\]\s*$', text, flags=re.M):
              text = text.rstrip() + '\n\n[env.production.ai]\nbinding = "AI"\n'

          def upsert_d1(doc: str, table: str) -> str:
              header = f"[[{table}]]"
              pattern = re.compile(rf'(?ms)^\[\[{re.escape(table)}\]\]\s*\n(?:(?!^\[).)*(?=^\[|\Z)')
              for match in list(pattern.finditer(doc)):
                  block = match.group(0)
                  if re.search(r'^binding\s*=\s*["\']NEWSNOW_DB["\']\s*$', block, flags=re.M):
                      replacement = block
                      values = {"binding": "NEWSNOW_DB", "database_name": db_name, "database_id": db_id}
                      for key, value in values.items():
                          line = f'{key} = "{value}"'
                          if re.search(rf'^{key}\s*=', replacement, flags=re.M):
                              replacement = re.sub(rf'^{key}\s*=.*$', line, replacement, flags=re.M)
                          else:
                              replacement = replacement.rstrip() + "\n" + line + "\n"
                      return doc[:match.start()] + replacement + doc[match.end():]
              block = f'\n\n{header}\nbinding = "NEWSNOW_DB"\ndatabase_name = "{db_name}"\ndatabase_id = "{db_id}"\n'
              return doc.rstrip() + block

          text = upsert_d1(text, "d1_databases")
          text = upsert_d1(text, "env.production.d1_databases")
          path.write_text(text)
          PY

          echo "Workers AI and NEWSNOW_DB bindings prepared with Wrangler ${WRANGLER_VERSION}"

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@${WRANGLER_VERSION} pages deploy dist/output/public --branch main

      - name: Verify production Workers AI runtime
        shell: bash
        run: |
          body_file=$(mktemp)
          status=""
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o "$body_file" -w '%{http_code}' "https://news.capx-ai.com/api/topics/health/status?ts=$(date +%s)" || true)
            body=$(cat "$body_file")
            echo "Workers AI check attempt $attempt/6: HTTP $status"
            echo "Workers AI response: $body"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done

          body=$(cat "$body_file")
          if [ "$status" != "200" ]; then
            echo "::error::Workers AI status endpoint returned HTTP $status: $body"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"enabled":true'; then
            echo "::error::Workers AI runtime check failed: $body"
            exit 1
          fi

      - name: Verify persistent intelligence runtime
        shell: bash
        run: |
          body_file=$(mktemp)
          status=""
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o "$body_file" -w '%{http_code}' "https://news.capx-ai.com/api/intelligence?topic=building&ts=$(date +%s)" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
          body=$(cat "$body_file")
          echo "Intelligence runtime check: HTTP $status"
          python - "$status" "$body_file" <<'PY'
          import json, sys
          status = sys.argv[1]
          if status != "200":
              raise SystemExit(f"Intelligence API returned HTTP {status}")
          with open(sys.argv[2], encoding="utf-8") as handle:
              data = json.load(handle)
          if data.get("persistent") is not True:
              raise SystemExit("D1 binding is not persistent at runtime")
          if data.get("aiEnabled") is not True:
              raise SystemExit("Workers AI is unavailable to intelligence classifier")
          if len(data.get("sources") or []) != 54:
              raise SystemExit(f"Expected 54 building sources, got {len(data.get('sources') or [])}")
          print(f"Persistent intelligence runtime OK: {len(data['sources'])} building sources")
          PY

      - name: Verify Jianing hot-topic classifier
        shell: bash
        run: |
          payload='{"items":[{"key":"surrogacy-test","title":"某女演员代孕事件引发关注，代孕妈妈经历妊娠和分娩","source":"test","rank":1},{"key":"public-test","title":"知名科技企业家公开分享长期服用二甲双胍抗衰老","source":"test","rank":2},{"key":"health-test","title":"研究显示每天快走30分钟有助于控制血糖","source":"test","rank":3},{"key":"sports-test","title":"郑钦文逆转震惊美网","source":"test","rank":4},{"key":"gossip-test","title":"刘亦菲脸比珠宝还闪","source":"test","rank":5},{"key":"noise-test","title":"某公司员工调岗后发起劳动维权","source":"test","rank":6}]}'

          body_file=$(mktemp)
          status=$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST "https://news.capx-ai.com/api/topics/health/classify?ts=$(date +%s)" \
            -H 'content-type: application/json' \
            --data "$payload" || true)
          body=$(cat "$body_file")
          echo "Jianing topic smoke test: HTTP $status"
          echo "Jianing topic response: $body"

          if [ "$status" != "200" ]; then
            echo "::error::Jianing topic classifier returned HTTP $status: $body"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"enabled":true'; then
            echo "::error::Jianing topic classifier did not complete successfully: $body"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"primaryLine"'; then
            echo "::error::Jianing topic classifier did not return topic-line metadata: $body"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"angle"'; then
            echo "::error::Jianing topic classifier did not return a suggested angle: $body"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"surrogacy-test"'; then
            echo "::error::Jianing topic classifier missed a direct surrogacy-to-health bridge: $body"
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"sports-test"'; then
            echo "::error::Jianing topic classifier invented a health bridge from a sports result: $body"
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"gossip-test"'; then
            echo "::error::Jianing topic classifier invented a health bridge from celebrity appearance gossip: $body"
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"noise-test"'; then
            echo "::error::Jianing topic classifier incorrectly kept an unrelated labor-dispute headline: $body"
            exit 1
          fi
