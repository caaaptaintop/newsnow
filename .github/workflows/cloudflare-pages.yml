name: Build and deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm run build
        env:
          CF_PAGES: 1

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID. Add it either as a repository Secret or repository Variable with exactly that name."
            exit 1
          fi

      - name: Download current Pages configuration
        run: |
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          pnpm exec wrangler pages download config capx-newsnow --force
          test -f wrangler.toml || (echo "::error::Expected wrangler.toml from Pages config download" && exit 1)

      - name: Prepare Pages configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("wrangler.toml")
          text = path.read_text()
          output_line = 'pages_build_output_dir = "dist/output/public"'

          if re.search(r'^pages_build_output_dir\s*=', text, flags=re.M):
              text = re.sub(
                  r'^pages_build_output_dir\s*=.*$',
                  output_line,
                  text,
                  flags=re.M,
              )
          else:
              first_table = re.search(r'^\[', text, flags=re.M)
              if first_table:
                  pos = first_table.start()
                  text = text[:pos].rstrip() + f'\n{output_line}\n\n' + text[pos:]
              else:
                  text = text.rstrip() + f'\n{output_line}\n'

          path.write_text(text)
          PY

      - name: Sync optional Z.AI API key to Pages
        shell: bash
        run: |
          if [ -n "$ZAI_API_KEY" ]; then
            printf '%s' "$ZAI_API_KEY" | pnpm exec wrangler pages secret put ZAI_API_KEY --project-name capx-newsnow
            echo "Z.AI API key synced to Cloudflare Pages"
          else
            echo "::notice::ZAI_API_KEY is not configured; health topic will fall back to keyword-only filtering"
          fi

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist/output/public --branch main
