name: Build and deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm run build
        env:
          CF_PAGES: 1

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID. Add it either as a repository Secret or repository Variable with exactly that name."
            exit 1
          fi

      - name: Download current Pages configuration
        run: |
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          pnpm exec wrangler pages download config capx-newsnow --force
          test -f wrangler.toml || (echo "::error::Expected wrangler.toml from Pages config download" && exit 1)

      - name: Enable Workers AI binding without losing existing bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("wrangler.toml")
          text = path.read_text()

          # Keep the downloaded dashboard configuration as source of truth, but
          # make sure this repository's actual build output directory is used.
          if re.search(r'^pages_build_output_dir\s*=', text, flags=re.M):
              text = re.sub(
                  r'^pages_build_output_dir\s*=.*$',
                  'pages_build_output_dir = "dist/output/public"',
                  text,
                  flags=re.M,
              )
          else:
              text += '\npages_build_output_dir = "dist/output/public"\n'

          # Pages supports a single Workers AI binding. Add it only when missing.
          if not re.search(r'^\[ai\]\s*$', text, flags=re.M):
              text += '\n[ai]\nbinding = "AI"\n'

          path.write_text(text)
          PY

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy --branch main
