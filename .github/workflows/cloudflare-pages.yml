name: Build and deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.129.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm run build
        env:
          CF_PAGES: 1

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID. Add it either as a repository Secret or repository Variable with exactly that name."
            exit 1
          fi

      - name: Download current Pages configuration
        run: |
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          pnpm dlx wrangler@${WRANGLER_VERSION} pages download config capx-newsnow --force
          test -f wrangler.toml || (echo "::error::Expected wrangler.toml from Pages config download" && exit 1)

      - name: Prepare Pages configuration and Workers AI binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("wrangler.toml")
          text = path.read_text()
          output_line = 'pages_build_output_dir = "dist/output/public"'

          if re.search(r'^pages_build_output_dir\s*=', text, flags=re.M):
              text = re.sub(r'^pages_build_output_dir\s*=.*$', output_line, text, flags=re.M)
          else:
              first_table = re.search(r'^\[', text, flags=re.M)
              if first_table:
                  pos = first_table.start()
                  text = text[:pos].rstrip() + f'\n{output_line}\n\n' + text[pos:]
              else:
                  text = text.rstrip() + f'\n{output_line}\n'

          if not re.search(r'^\[ai\]\s*$', text, flags=re.M):
              text = text.rstrip() + '\n\n[ai]\nbinding = "AI"\n'
          if not re.search(r'^\[env\.production\.ai\]\s*$', text, flags=re.M):
              text = text.rstrip() + '\n\n[env.production.ai]\nbinding = "AI"\n'

          # Repository snapshots are the durable store. Keep a valid existing D1
          # binding if an administrator adds one later, but remove an incomplete
          # NEWSNOW_DB draft so Pages deployment never requires D1 permissions.
          def remove_incomplete_newsnow_d1(doc: str, table: str) -> str:
              pattern = re.compile(rf'(?ms)^\[\[{re.escape(table)}\]\]\s*\n(?:(?!^\[).)*(?=^\[|\Z)')
              pieces = []
              cursor = 0
              for match in pattern.finditer(doc):
                  block = match.group(0)
                  is_newsnow = re.search(r'^binding\s*=\s*["\']NEWSNOW_DB["\']\s*$', block, flags=re.M)
                  has_id = re.search(r'^database_id\s*=\s*["\'][^"\']+["\']\s*$', block, flags=re.M)
                  if is_newsnow and not has_id:
                      pieces.append(doc[cursor:match.start()])
                      cursor = match.end()
              pieces.append(doc[cursor:])
              return ''.join(pieces)

          text = remove_incomplete_newsnow_d1(text, "d1_databases")
          text = remove_incomplete_newsnow_d1(text, "env.production.d1_databases")
          path.write_text(text)
          PY

          echo "Workers AI binding prepared; durable intelligence uses repository snapshots."

      - name: Synchronize verified publication dates to existing D1 records
        shell: bash
        run: |
          node tools/ai-bridge/publication-sql.mjs data/intelligence-snapshot.json publication-dates.sql
          pnpm dlx wrangler@${WRANGLER_VERSION} --version
          pnpm dlx wrangler@${WRANGLER_VERSION} d1 execute 1b866a6d-8942-490b-bb6d-3f07fffa9e36 --remote --file publication-dates.sql --yes

      - name: Deploy to Cloudflare Pages
        id: cloudflare_deploy
        shell: bash
        run: |
          set +e
          pnpm dlx wrangler@${WRANGLER_VERSION} pages deploy dist/output/public --branch main 2>&1 | tee wrangler-deploy.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Preserve Cloudflare deploy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deploy-diagnostics
          path: wrangler-deploy.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify production SPA shell
        shell: bash
        run: |
          body_file=$(mktemp)
          status=""
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -L -o "$body_file" -w '%{http_code}' "https://news.capx-ai.com/?shell_smoke=$(date +%s)" || true)
            if [ "$status" = "200" ] && grep -q '<div id="app"></div>' "$body_file" && grep -Eq '/assets/index-[A-Za-z0-9_-]+\.js' "$body_file"; then
              break
            fi
            echo "SPA shell attempt $attempt/6 failed: HTTP $status"
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "::error::SPA shell returned HTTP $status"
            head -c 2000 "$body_file" || true
            exit 1
          fi
          if ! grep -q '<div id="app"></div>' "$body_file" || ! grep -Eq '/assets/index-[A-Za-z0-9_-]+\.js' "$body_file"; then
            echo "::error::SPA shell or client bundle reference is missing"
            head -c 4000 "$body_file" || true
            exit 1
          fi
          echo "SPA shell OK; real client mounting is checked by Client runtime smoke."

      - name: Verify production Workers AI binding
        shell: bash
        run: |
          body_file=$(mktemp)
          status=""
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o "$body_file" -w '%{http_code}' "https://news.capx-ai.com/api/topics/health/status?ts=$(date +%s)" || true)
            body=$(cat "$body_file")
            echo "Workers AI binding check attempt $attempt/6: HTTP $status"
            echo "Workers AI response: $body"
            if [ "$status" = "200" ] && printf '%s' "$body" | grep -q '"binding":true'; then
              break
            fi
            sleep 5
          done
          body=$(cat "$body_file")
          if [ "$status" != "200" ] || ! printf '%s' "$body" | grep -q '"binding":true'; then
            echo "::error::Workers AI binding check failed: HTTP $status $body"
            exit 1
          fi

      - name: Verify intelligence workspace runtime
        shell: bash
        run: |
          body_file=$(mktemp)
          status=""
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o "$body_file" -w '%{http_code}' "https://news.capx-ai.com/api/intelligence?topic=building&ts=$(date +%s)" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
          python - "$status" "$body_file" <<'PY'
          import json, sys
          status = sys.argv[1]
          if status != "200":
              raise SystemExit(f"Intelligence API returned HTTP {status}")
          with open(sys.argv[2], encoding="utf-8") as handle:
              data = json.load(handle)
          if data.get("persistent") is not True:
              raise SystemExit("Repository snapshot persistence is unavailable")
          if data.get("aiEnabled") is not True:
              raise SystemExit("Workers AI binding is unavailable to intelligence classifier")
          if len(data.get("sources") or []) != 54:
              raise SystemExit(f"Expected 54 building sources, got {len(data.get('sources') or [])}")
          if not data.get("articles"):
              raise SystemExit("Durable building snapshot is unexpectedly empty")
          print(f"Intelligence runtime OK: {len(data['sources'])} building sources, {len(data['articles'])} durable building articles")
          PY

      - name: Verify Jianing classifier route without consuming AI quota
        shell: bash
        run: |
          body_file=$(mktemp)
          status=$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST "https://news.capx-ai.com/api/topics/health/classify?ts=$(date +%s)" \
            -H 'content-type: application/json' \
            --data '{"items":[]}' || true)
          body=$(cat "$body_file")
          echo "Jianing route check: HTTP $status"
          echo "Jianing route response: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Jianing classifier route returned HTTP $status: $body"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"matches":\[\]'; then
            echo "::error::Jianing classifier route returned an unexpected response: $body"
            exit 1
          fi
